<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14122b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Zvukové páry</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#14122b;color:#eee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;gap:6px}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat small{font-size:10px;opacity:.6;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
#mult{color:#ffd166}
header .btns{display:flex;gap:6px}
button{font:inherit;border:0;border-radius:12px;background:#2b2760;color:#eee;padding:9px 11px;font-size:14px}
button:active{transform:scale(.96)}
#board{position:relative;flex:1;margin-bottom:12px;touch-action:manipulation}
.card{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:16%;
 background:#3d3890;border:2px solid #8a84e8;
 transition:transform .2s,opacity .35s,box-shadow .2s,border-color .2s,filter .25s;cursor:pointer}
.card.sel{border-color:#ffd166;box-shadow:0 0 0 3px #ffd16688,0 6px 14px #000a!important;transform:scale(1.1)!important}
.card svg{width:1em;height:1em;display:block}
.card.gone{opacity:0;transform:scale(1.5)!important;pointer-events:none}
.card.bad{animation:shake .35s}
.card.hint{animation:glow .5s 3;border-color:#7dffb0}
@keyframes shake{25%{translate:-5px 0}75%{translate:5px 0}}
@keyframes glow{50%{box-shadow:0 0 0 5px #7dffb0aa}}
.float{position:absolute;pointer-events:none;font-weight:700;color:#ffd166;font-size:22px;animation:up .8s forwards;z-index:9999}
.float.neg{color:#ff7b7b}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
#toast{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:#000a;padding:6px 12px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9999;white-space:nowrap}
#toast.show{opacity:1}
#overlay{position:fixed;inset:0;background:#14122bee;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px;z-index:20000}
#overlay.show{display:flex}
#overlay h1{margin:0;font-size:30px}
#overlay .big{font-size:64px;font-weight:800;color:#ffd166}
#overlay p{margin:2px 0;opacity:.85}
#overlay button{background:#ffd166;color:#14122b;font-weight:700;font-size:18px;padding:14px 30px}
</style>
</head>
<body>
<div id="app">
 <header>
  <div class="stat"><small>Body</small><b id="score">0</b></div>
  <div class="stat"><small>Série</small><b id="mult">x1</b></div>
  <div class="stat"><small id="lvl">Level 1 · zbývá</small><b id="left">16</b></div>
  <div class="btns"><button id="hint" aria-label="Rada">Rada</button><button id="snd" aria-label="Zvuk">Zvuk</button></div>
 </header>
 <div id="board"><div id="toast"></div></div>
</div>
<div id="overlay"></div>
<script>
const MUSIC=['🎸','🎹','🎺','🎻','🥁','🎤','🎧','🎷','🪕','🪗','🎼','🎵','🎶','🔔','📯','📻','🎙️','🎛️','🎚️','💿','📀','🎭','🎬','🪩','🎪','🎠','🎟️','🎫','🎡','🪘'];
const PUNK=['🤘','💀','🧷','⛓️','⚡','🔥','🏴','🦇','🕷️','🧨','💣','👢','🛹','💥','🩸','📼','🔊','🕶️','🦴','🖤','svg:anarchy','svg:mohawk','svg:spike','svg:boombox'];
const SYM=[...PUNK,...MUSIC];
// podobné motivy, od vyšších levelů se z nich skládají páry, které se snadno zaměnit
const SIMILAR=[['🎸','🪕'],['💀','🦴'],['🧷','⛓️'],['🔥','💥'],['🥁','🪘'],['🎤','🎙️'],['⚡','💥'],['📻','svg:boombox'],['💿','📀'],['🎺','📯'],['🏴','🖤'],['🦇','🕷️']];
const SVGS={
 anarchy:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M7 19L12 5l5 14M8.6 14.5h6.8"/><path d="M3 10l3 4M21 10l-3 4" stroke-width="0"/></svg>',
 mohawk:'<svg viewBox="0 0 24 24"><path d="M9 4l1 4M12 2l.5 5M15 4l-1 4" stroke="#ff4fa3" stroke-width="2.6" stroke-linecap="round"/><circle cx="12" cy="14" r="6.5" fill="#ffd9b0"/><path d="M9.5 13h1.5M13 13h1.5" stroke="#222" stroke-width="1.6" stroke-linecap="round"/><path d="M10 17q2 1.6 4 0" stroke="#222" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>',
 spike:'<svg viewBox="0 0 24 24"><rect x="2" y="9" width="20" height="6" rx="2" fill="#222" stroke="#aaa" stroke-width="1"/><path d="M5 9l1.5-5L8 9M10.5 9L12 4l1.5 5M16 9l1.5-5L19 9" fill="#e5e5e5"/><path d="M5 15l1.5 5L8 15M10.5 15L12 20l1.5-5M16 15l1.5 5L19 15" fill="#e5e5e5"/></svg>',
 boombox:'<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="2" fill="#222" stroke="#ccc" stroke-width="1.2"/><circle cx="7.5" cy="13" r="3.4" fill="#555" stroke="#ccc"/><circle cx="16.5" cy="13" r="3.4" fill="#555" stroke="#ccc"/><rect x="9.5" y="8" width="5" height="2.4" fill="#ff4fa3"/><path d="M5 6l3-3h8l3 3" fill="none" stroke="#ccc" stroke-width="1.2"/></svg>'
};
const iconHTML=s=>s.startsWith('svg:')?SVGS[s.slice(4)]:s;
const SCALE=[0,2,4,7,9]; // pentatonika
const noteHz=i=>261.63*Math.pow(2,(SCALE[i%5]+12*(Math.floor(i/5)%3))/12);
const K=.92; // velikost karty v jednotkách kroku mřížky
const $=id=>document.getElementById(id);
const board=$('board');
let cards,sel,score,streak,bestStreak,okPairs,mistakes,lock,level=1,muted=false,ac,dims,toastT;
try{muted=localStorage.zp_muted==='1'}catch(e){}
$('snd').textContent=muted?'Ticho':'Zvuk';
$('snd').onclick=()=>{muted=!muted;$('snd').textContent=muted?'Ticho':'Zvuk';try{localStorage.zp_muted=muted?'1':'0'}catch(e){}};
$('hint').onclick=hint;

function tone(f,dur=.5,type='sine',vol=.18){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1400)}

// Rozložení: vrstvy karet přes sebe (jako mahjong). Každá vrstva je maska, "off" posune vrstvu o půl karty.
const full=(c,r)=>Array(r).fill('x'.repeat(c));
const LEVELS=[
 {name:'Rozjezd',layers:[{off:0,m:full(4,5)},{off:.5,m:full(3,4)}]},
 {name:'Dvě patra',layers:[{off:0,m:full(5,6)},{off:.5,m:full(4,5)}]},
 {name:'Pódium',layers:[{off:0,m:full(5,6)},{off:.5,m:full(4,5)},{off:0,m:['.....','..xx.','.xxx.','.xxx.','.xx..','.....']}]},
 {name:'Srdce',layers:[{off:0,m:['xx..xx','xxxxxx','xxxxxx','.xxxx.','..xx..']},{off:.5,m:['xxxxx','xxxxx','.xxx.','..x..']},{off:0,m:['......','.xxxx.','.xxxx.','......','......']}]},
 {name:'Věž',layers:[{off:0,m:full(5,6)},{off:.5,m:full(4,5)},{off:0,m:['.....','.xxx.','.xxx.','.xxx.','.xxx.','.....']},{off:.5,m:['....','.xx.','.xx.','.xx.','....']}]}
];
function positions(lv){
  const D=LEVELS[(lv-1)%LEVELS.length],P=[];
  D.layers.forEach((La,l)=>La.m.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='x')P.push({l,x:c+La.off,y:r+La.off})})));
  return {cols:D.layers[0].m[0].length,rows:D.layers[0].m.length,P,name:D.name};
}
// výběr motivů: punkových je většina, od levelu 4 přibývají podobné dvojice
function pickMotifs(n,lv){
  const chosen=[];
  const addOne=s=>{if(!chosen.includes(s)&&chosen.length<n)chosen.push(s)};
  if(lv>=4){
    const want=Math.round(n*Math.min(.7,(lv-3)*.25));
    for(const g of shuffle(SIMILAR.slice())){if(chosen.length+2>want)break;g.forEach(addOne)}
  }
  const rest=[...shuffle(PUNK.slice()).filter(s=>!chosen.includes(s)).slice(0,Math.ceil(n*.6)),...shuffle(MUSIC.slice())];
  for(const s of rest)addOne(s);
  return shuffle(chosen);
}
const covers=(b,a)=>b.l>a.l&&Math.abs(b.x-a.x)<K&&Math.abs(b.y-a.y)<K;
// Každý pár vznikne ze dvou právě odkrytých karet, takže je level vždy řešitelný.
function build(lv){
  const L=positions(lv);
  for(let t=0;t<500;t++){
    const rem=L.P.map(p=>({...p})),order=[];
    while(rem.length){
      const free=rem.filter(a=>!rem.some(b=>b!==a&&covers(b,a)));
      if(free.length<2)break;
      const [x,y]=shuffle(free.slice());
      order.push([x,y]);rem.splice(rem.indexOf(x),1);rem.splice(rem.indexOf(y),1);
    }
    if(!rem.length){
      const syms=pickMotifs(order.length,lv);
      order.forEach(([x,y],i)=>{x.sym=y.sym=syms[i]});
      return {cols:L.cols,rows:L.rows,name:L.name,P:order.flat()};
    }
  }
}
function layout(){
  const W=board.clientWidth,H=board.clientHeight,{cols,rows}=dims;
  const step=Math.min(84,W/(cols-1+K),H/(rows-1+K)),s=K*step;
  const ox=(W-((cols-1)*step+s))/2,oy=(H-((rows-1)*step+s))/2;
  cards.forEach((c,i)=>{
    Object.assign(c.el.style,{width:s+'px',height:s+'px',left:ox+c.x*step+'px',top:oy+c.y*step+'px',
      fontSize:s*.55+'px',transform:`translate(${-c.l*2}px,${-c.l*3}px) rotate(${c.rot}deg)`,
      zIndex:c.l*100+i%100,boxShadow:`0 3px 0 #1d1a4d,0 ${4+c.l*3}px ${8+c.l*4}px #000b`});
  });
}
const isFree=a=>!a.gone&&!cards.some(b=>!b.gone&&b!==a&&covers(b,a));
function start(){
  $('overlay').classList.remove('show');
  board.querySelectorAll('.card,.float').forEach(n=>n.remove());
  streak=0;bestStreak=0;okPairs=0;mistakes=0;sel=null;lock=false;
  dims=build(level);
  cards=dims.P.map(p=>{
    const el=document.createElement('div');el.className='card';el.innerHTML=iconHTML(p.sym);
    const c={...p,el,gone:false,rot:(Math.random()-.5)*4};
    el.addEventListener('pointerdown',e=>{e.preventDefault();tap(c)});
    board.appendChild(el);return c;
  });
  layout();hud();toast('Level '+level+': '+dims.name);
}
function hud(){
  $('score').textContent=score;$('mult').textContent='x'+Math.min(streak+1,5);
  $('lvl').textContent='Level '+level+' · zbývá';
  $('left').textContent=cards.filter(c=>!c.gone).length/2;
}
function pop(c,txt,neg){
  const f=document.createElement('div');f.className='float'+(neg?' neg':'');f.textContent=txt;
  f.style.left=c.el.offsetLeft+c.el.offsetWidth/3+'px';f.style.top=c.el.offsetTop+'px';
  board.appendChild(f);setTimeout(()=>f.remove(),800);
}
function hint(){
  if(lock)return;
  const by={};
  for(const c of cards)if(isFree(c)){(by[c.sym]=by[c.sym]||[]).push(c)}
  const pair=Object.values(by).find(a=>a.length>=2);
  if(!pair)return;
  score=Math.max(0,score-50);hud();toast('Rada stojí 50 bodů');
  pair.slice(0,2).forEach(c=>{c.el.classList.add('hint');setTimeout(()=>c.el.classList.remove('hint'),1600)});
}
function tap(c){
  if(lock||c.gone)return;
  if(c===sel){sel=null;c.el.classList.remove('sel');return}
  if(!isFree(c)){
    c.el.classList.add('bad');setTimeout(()=>c.el.classList.remove('bad'),350);
    tone(180,.15,'triangle',.05);toast('Tahle karta je zakrytá. Odeber nejdřív karty nad ní.');return;
  }
  if(!sel){sel=c;c.el.classList.add('sel');tone(noteHz(SYM.indexOf(c.sym)),.15,'triangle',.08);return}
  const a=sel;sel=null;a.el.classList.remove('sel');
  if(a.sym===c.sym){
    const gain=100*Math.min(streak+1,5);
    streak++;bestStreak=Math.max(bestStreak,streak);okPairs++;score+=gain;
    a.gone=c.gone=true;a.el.classList.add('gone');c.el.classList.add('gone');
    const n=SYM.indexOf(c.sym);tone(noteHz(n),.6);tone(noteHz(n)*2,.4,'sine',.07);
    pop(c,'+'+gain);hud();
    if(cards.every(x=>x.gone))setTimeout(end,700);
  }else{
    streak=0;mistakes++;
    if(score>0){score=Math.max(0,score-20);pop(c,'-20',true)}
    lock=true;[a,c].forEach(x=>x.el.classList.add('bad'));tone(110,.25,'sawtooth',.06);
    setTimeout(()=>{[a,c].forEach(x=>x.el.classList.remove('bad'));lock=false},350);
    hud();
  }
}
function end(){
  const bonus=mistakes===0?500:0;score+=bonus;
  const acc=Math.round(100*okPairs/(okPairs+mistakes));
  let best=0;try{best=+localStorage.zp_best||0;if(score>best){best=score;localStorage.zp_best=best}}catch(e){best=Math.max(best,score)}
  [0,2,4,7,9].forEach((s,i)=>setTimeout(()=>tone(261.63*Math.pow(2,s/12),.5),i*120));
  $('overlay').innerHTML=`<h1>Level ${level}: ${dims.name}</h1><p>hotovo</p><div class="big">${score}</div>
   <p>Přesnost: ${acc} %</p><p>Nejdelší série: ${bestStreak}</p>
   ${bonus?'<p>Bonus za level bez chyby: +500</p>':''}<p>Rekord: ${best}</p>
   <button id="next">Level ${level+1}: ${positions(level+1).name}</button>`;
  $('overlay').classList.add('show');$('next').onclick=()=>{level++;start()};
}
addEventListener('resize',()=>cards&&layout());
score=0;start();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
