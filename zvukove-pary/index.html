<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1c6a49">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Zvukové páry</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#1c6a49;color:#f3ecd0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% 35%,#2d8c64 0%,#1c6a49 55%,#123f2c 100%) fixed}
#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;gap:6px}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat small{font-size:10px;color:#b9d8c8;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;font-weight:600}
.stat b{font-size:22px;font-variant-numeric:tabular-nums;color:#fff7dc}
#mult{color:#ffd54a}
#slots{display:flex;gap:7px;justify-content:center;padding:7px 9px;margin:0 auto 10px;width:fit-content;border-radius:12px;background:linear-gradient(#8f5e33,#5f3b1d);box-shadow:0 3px 0 #2d1a09,0 6px 10px #0006,inset 0 1px 0 #c58a55}
.slot{flex:none;width:50px;height:64px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#124a33;box-shadow:inset 0 3px 6px #000b}
.slot .card{position:relative;left:auto;top:auto;width:100%;height:100%}
footer{display:flex;gap:8px;padding:0 0 10px}
footer button{flex:1}
button{font:inherit;border:1px solid #3d2410;border-radius:12px;background:linear-gradient(#a06a3b,#6e4422);color:#fbeed0;padding:11px 12px;font-size:15px;font-weight:700;box-shadow:0 3px 0 #2d1a09,inset 0 1px 0 #d9a06b;text-shadow:0 1px 0 #2d1a09}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #2d1a09,inset 0 1px 0 #d9a06b}
#board{position:relative;flex:1;margin-bottom:10px;touch-action:manipulation}
.card{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:9px;
 background:linear-gradient(160deg,#fffef7,#f0e8cf);border:1px solid #c9c09b;
 transition:transform .2s,opacity .35s,box-shadow .2s;cursor:pointer}
.card::before{content:"";position:absolute;inset:3px;border:1px solid #e2dab9;border-radius:6px;pointer-events:none}
.card svg{width:1em;height:1em;display:block;position:relative}
.card.sel{box-shadow:0 0 0 3px #ffd54a,0 0 14px 4px #ffd54acc,3px 4px 0 #1f8160!important;transform:scale(1.08)!important}
.card.gone{opacity:0;transform:scale(1.5)!important;pointer-events:none}
.card.bad{animation:shake .35s}
.card.hint{animation:glow .5s 3}
@keyframes shake{25%{translate:-5px 0}75%{translate:5px 0}}
@keyframes glow{50%{box-shadow:0 0 0 4px #4df0ff,0 0 16px 6px #4df0ffcc}}
.float{position:absolute;pointer-events:none;font-weight:800;color:#ffd54a;font-size:22px;text-shadow:0 1px 3px #000;animation:up .8s forwards;z-index:9999}
.float.neg{color:#ff8a80}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
#toast{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:#0b2a1ddd;color:#fff;padding:6px 12px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9999;text-align:center;max-width:94%;white-space:nowrap}
#toast.show{opacity:1}
#overlay{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#1f7a55,#0f3a28);display:none;align-items:center;justify-content:safe center;flex-direction:column;gap:12px;text-align:center;padding:20px;z-index:20000;overflow:auto}
#overlay.show{display:flex}
#overlay h1{margin:0;font-size:28px;color:#fff7dc}
#overlay .big{font-size:56px;font-weight:800;color:#ffd54a;text-shadow:0 2px 0 #7a5a00}
#overlay p{margin:2px 0;color:#d9ecdf}
#overlay .rules{font-size:13px;max-width:310px;line-height:1.4;color:#bcd9c9}
#overlay button{background:linear-gradient(#ffd54a,#e0a800);color:#2a1d00;border-color:#8a6500;font-weight:800;font-size:18px;padding:14px 30px;min-width:230px;text-shadow:none;box-shadow:0 3px 0 #7a5a00,inset 0 1px 0 #fff3b0}
#overlay button.alt{background:linear-gradient(#2f8a63,#1c5f43);color:#f3ecd0;border-color:#0f3a28;font-weight:700;font-size:16px;box-shadow:0 3px 0 #0b2a1d,inset 0 1px 0 #5cc093}
#overlay input{font:inherit;font-size:16px;text-align:center;padding:10px;border:2px solid #0f3a28;border-radius:12px;background:#fffef7;color:#1b1b2f;width:230px;user-select:text}
#lb{list-style:none;margin:0;padding:0;width:min(320px,100%);text-align:left}
#lb li{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:9px;background:linear-gradient(160deg,#fffef7,#f0e8cf);color:#1b1b2f;margin-bottom:5px;font-variant-numeric:tabular-nums;box-shadow:2px 2px 0 #1f8160}
#lb li.me{background:linear-gradient(#ffe27a,#ffc933);font-weight:700}
#lb .pos{width:26px;color:#6b6648}
#lb .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lb .lv{color:#6b6648;font-size:12px}
.note{font-size:12px;color:#9cc3b0}
#overlay button small{display:block;font-weight:500;font-size:12px;opacity:.8;margin-top:2px}
.logo{display:flex;justify-content:center;margin-bottom:2px}
.mini{width:54px;height:70px;border-radius:9px;background:linear-gradient(160deg,#fffef7,#f0e8cf);border:1px solid #c9c09b;box-shadow:1px 1px 0 #35a47c,2px 2px 0 #2a9a72,3px 3px 0 #1f8160,4px 5px 0 #17694c,5px 8px 9px #0009;display:flex;align-items:center;justify-content:center;font-size:44px;margin:0 -4px}
.mini svg{width:1em;height:1em;display:block}
.mini:nth-child(1){transform:rotate(-9deg) translateY(4px)}
.mini:nth-child(3){transform:rotate(9deg) translateY(4px)}
.mini:nth-child(2){z-index:1;transform:translateY(-4px)}
#overlay .sub{margin:-4px 0 4px;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:#b9d8c8}
.stats{display:flex;gap:8px;justify-content:center}
.stats div{background:linear-gradient(160deg,#fffef7,#f0e8cf);color:#1b1b2f;border-radius:9px;padding:6px 10px;min-width:86px;box-shadow:2px 2px 0 #1f8160}
.stats small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#6b6648}
.stats b{font-size:20px}
.field{display:flex;flex-direction:column;gap:4px;align-items:center}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#b9d8c8}
.stepper{display:flex;align-items:center;gap:10px;justify-content:center}
.stepper b{min-width:150px;font-size:15px;color:#fff7dc}
#overlay .stepper button{min-width:0;width:40px;padding:6px 0;font-size:20px}
#overlay button.link{background:none;border:0;box-shadow:none;color:#b9d8c8;font-size:14px;font-weight:600;min-width:0;padding:6px;text-decoration:underline;text-shadow:none}
.howto{background:#0b2a1dcc;border-radius:12px;padding:10px 14px;max-width:320px;text-align:left;font-size:13px;line-height:1.45;color:#d9ecdf}
.howto p{margin:0 0 6px}
</style>
</head>

const SCALE=[0,2,4,7,9];
const noteHz=i=>261.63*Math.pow(2,(SCALE[i%5]+12*(Math.floor(i/5)%3))/12);

$('snd').onclick=()=>{muted=!muted;$('snd').textContent=muted?'Ticho':'Zvuk';try{localStorage.zp_muted=muted?'1':'0'}catch(e){}};
function tone(f,dur=.5,type='sine',vol=.18){
  if(muted)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}
// ---------- náhoda (pro denní výzvu se stejným rozložením všem) ----------
let R=Math.random;
const mulberry32=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=R()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1800)}

// ---------- rozložení: vrstvy karet přes sebe ----------
const full=(c,r)=>Array(r).fill('x'.repeat(c));
const LEVELS=[
 {name:'Rozjezd',layers:[{off:0,m:full(4,5)},{off:.5,m:full(3,4)},{off:0,m:['....','.xx.','.xx.','.xx.','....']}]},
 {name:'Schody',layers:[{off:0,m:['xxxxx','xxxx.','xxx..','xx...','x....']},{off:.5,m:['xxxx','xxx.','xx..','x...']},{off:0,m:['.....','xxx..','xx...','.....','.....']}]},

 {name:'Kříž',layers:[{off:0,m:['..xx..','..xx..','xxxxxx','xxxxxx','..xx..','..xx..']},{off:.5,m:['..x..','.xxx.','xxxxx','.xxx.','.....']},{off:0,m:['......','......','..xx..','..xx..','......','......']}]},
 {name:'Věnec',layers:[{off:0,m:['xxxxxx','x....x','x....x','x....x','x....x','xxxxxx']},{off:.5,m:['xxxxx','x...x','x...x','x...x','xxxxx']},{off:0,m:['......','.xxxx.','.x..x.','.x..x.','.xxxx.','......']}]},
 {name:'Pódium',layers:[{off:0,m:full(5,6)},{off:.5,m:full(4,5)},{off:0,m:['.....','..xx.','.xxx.','.xxx.','.xx..','.....']}]},
 {name:'Srdce',layers:[{off:0,m:['xx..xx','xxxxxx','xxxxxx','.xxxx.','..xx..']},{off:.5,m:['xxxxx','xxxxx','.xxx.','..x..']},{off:0,m:['......','.xxxx.','.xxxx.','......','......']}]},
 {name:'Motýl',layers:[{off:0,m:['xx..xx','xxxxxx','xxxxxx','xxxxxx','xx..xx']},{off:.5,m:['xx.xx','xxxxx','xxxxx','xx.xx']},{off:0,m:['......','..xx..','..xx..','..xx..','......']}]},
 {name:'Věž',layers:[{off:0,m:full(5,6)},{off:.5,m:full(4,5)},{off:0,m:['.....','.xxx.','.xxx.','.xxx.','.xxx.','.....']},{off:.5,m:['....','.xx.','.xx.','.xx.','....']}]},
 {name:'Želva',layers:[{off:0,m:['.xxxx.','xxxxxx','xxxxxx','xxxxxx','xxxxxx','xxxxxx','.xxxx.']},{off:.5,m:['.xxx.','xxxxx','xxxxx','xxxxx','xxxxx','.xxx.']},{off:0,m:['......','..xx..','.xxxx.','.xxxx.','.xxxx.','..xx..','......']},{off:.5,m:['.....','.xxx.','.xxx.','.xx..','.....','.....']}]}
];
const K=.92;
function positions(idx){
  const D=LEVELS[idx%LEVELS.length],P=[];
  D.layers.forEach((La,l)=>La.m.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='x')P.push({l,x:c+La.off,y:r+La.off})})));
  return {cols:D.layers[0].m[0].length,rows:D.layers[0].m.length,P,name:D.name};
}
// karta je zakrytá, když na ní leží karta z vyšší vrstvy
const covers=(b,a)=>b.l>a.l&&Math.abs(b.x-a.x)<K&&Math.abs(b.y-a.y)<K;
// soused vlevo (dir -1) nebo vpravo (dir 1) ve stejné vrstvě a řádku
const side=(b,a,dir)=>{const d=(b.x-a.x)*dir;return b.l===a.l&&Math.abs(b.y-a.y)<K&&d>0&&d<1.2};
// 'covered' = zakrytá, 'locked' = sevřená mezi dvěma kartami, 'free' = jde zpárovat
function stateIn(a,list){
  let L=false,Rr=false;
  for(const b of list){
    if(b===a)continue;
    if(covers(b,a))return 'covered';
    if(side(b,a,-1))L=true;
    if(side(b,a,1))Rr=true;
  }
  return L&&Rr?'locked':'free';
}
function pickMotifs(n,diff){
  const chosen=[];
  const addOne=s=>{if(!chosen.includes(s)&&chosen.length<n)chosen.push(s)};
  if(diff>=1){
    const want=Math.round(n*Math.min(.7,.1+diff*.12));
    for(const g of shuffle(SIMILAR.slice())){if(chosen.length+2>want)break;g.forEach(addOne)}
  }
  const rest=[...shuffle(PUNK.slice()).filter(s=>!chosen.includes(s)).slice(0,Math.ceil(n*.6)),...shuffle(MUSIC.slice())];
  for(const s of rest)addOne(s);
  return shuffle(chosen);
}
// Každý pár vznikne ze dvou právě volných karet (podle stejných pravidel jako ve hře), takže je level vždy řešitelný.
function build(idx,diff,rng){
  R=rng||Math.random;
  try{
    const L=positions(idx);
    for(let t=0;t<2000;t++){
      const rem=L.P.map(p=>({...p})),order=[];
      while(rem.length){
        const free=rem.filter(a=>stateIn(a,rem)==='free');
        if(free.length<2)break;
        const [x,y]=shuffle(free.slice());
        order.push([x,y]);rem.splice(rem.indexOf(x),1);rem.splice(rem.indexOf(y),1);
      }
      if(!rem.length){
        const syms=pickMotifs(order.length,diff);
        order.forEach(([x,y],i)=>{x.sym=y.sym=syms[i]});
        return {cols:L.cols,rows:L.rows,name:L.name,P:order.flat()};
      }
    }
  }finally{R=Math.random}
}

// ---------- hra ----------
let slots=[],runId='',cards,sel,score,streak,bestStreak,okPairs,mistakes,lock,level=1,dims,mode='play',playing=false;
const AR=1.3; // poměr výšky a šířky kamene
function layout(){
  const W=board.clientWidth-8,H=board.clientHeight-8,{cols,rows}=dims;
  const stepX=Math.min(70,W/(cols-1+K),H/((rows-1)*AR+K*AR)),stepY=stepX*AR,w=K*stepX,hh=K*stepY;
  const ox=(W-((cols-1)*stepX+w))/2,oy=(H-((rows-1)*stepY+hh))/2;
  cards.forEach((c,i)=>{
    if(c.parked)return;
    Object.assign(c.el.style,{width:w+'px',height:hh+'px',left:ox+c.x*stepX+'px',top:oy+c.y*stepY+'px',
      fontSize:w*.8+'px',transform:`translate(${-c.l*3}px,${-c.l*4}px)`,
      zIndex:c.l*100+i%100,boxShadow:`1px 1px 0 #35a47c,2px 2px 0 #2a9a72,3px 3px 0 #1f8160,4px 5px 0 #17694c,5px 8px 9px #0009`});
  });
}
const live=()=>cards.filter(c=>!c.gone&&!c.parked);
const cardState=a=>stateIn(a,live());
const slotCount=lv=>Math.max(1,3-Math.floor((lv-1)/3));
function newRound(idx,diff,rng,nSlots){
  $('overlay').classList.remove('show');
  board.querySelectorAll('.card,.float').forEach(n=>n.remove());
  slots=Array(nSlots).fill(null);
  slotsEl.innerHTML=slots.map((_,i)=>`<div class="slot" data-i="${i}"></div>`).join('');
  streak=0;bestStreak=0;okPairs=0;mistakes=0;sel=null;lock=false;playing=true;
  dims=build(idx,diff,rng);
  cards=dims.P.map(p=>{
    const el=document.createElement('div');el.className='card';el.innerHTML=ICONS[p.sym];
    const c={...p,el,gone:false,rot:0};
    el.addEventListener('pointerdown',e=>{e.preventDefault();tap(c)});
    board.appendChild(el);return c;
  });
  layout();hud();
}
function startLevel(){newRound((level-1)%LEVELS.length,level,null,slotCount(level));toast('Level '+level+': '+dims.name+' · okýnka: '+slotCount(level))}
const dayNum=()=>{const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};
function startDaily(){
  const seed=dayNum();
  mode='daily';score=0;
  newRound(2+seed%(LEVELS.length-2),5,mulberry32(seed),2);
  toast('Denní výzva: '+dims.name+' · okýnka: 2');
}
const slotsEl=$('slots');
function parkCard(c,i){
  const r0=c.el.getBoundingClientRect();
  c.parked=true;slots[i]=c;slotsEl.children[i].appendChild(c.el);c.el.style.cssText='font-size:38px';
  const r1=c.el.getBoundingClientRect();
  c.el.animate([{transform:`translate(${r0.left-r1.left}px,${r0.top-r1.top}px)`},{transform:'none'}],{duration:320,easing:'ease-out'});
}
slotsEl.addEventListener('pointerdown',e=>{
  const s=e.target.closest('.slot');if(!s||!playing||lock)return;
  const i=+s.dataset.i;if(slots[i])return;
  if(!sel||sel.parked){toast('Vyber odkrytou kartu a klepni na prázdné okýnko. Odložená karta tam počká na svého dvojče.');return}
  const c=sel;sel=null;c.el.classList.remove('sel');
  parkCard(c,i);tone(300,.12,'triangle',.08);hud();
});
function hud(){
  $('score').textContent=score;$('mult').textContent='x'+Math.min(streak+1,5);
  $('lvl').textContent=(mode==='daily'?'Denní výzva':'Level '+level)+' · zbývá';
  $('left').textContent=cards.filter(c=>!c.gone).length/2;
}
function pop(c,txt,neg){
  const f=document.createElement('div');f.className='float'+(neg?' neg':'');f.textContent=txt;
  f.style.left=c.el.offsetLeft+c.el.offsetWidth/3+'px';f.style.top=c.el.offsetTop+'px';
  board.appendChild(f);setTimeout(()=>f.remove(),800);
}
$('hint').onclick=()=>{
  if(lock||!playing)return;
  const by={};
  for(const c of cards)if(!c.gone&&(c.parked||cardState(c)==='free')){(by[c.sym]=by[c.sym]||[]).push(c)}
  const pair=Object.values(by).find(a=>a.length>=2);
  if(!pair)return;
  score=Math.max(0,score-50);hud();toast('Rada stojí 50 bodů');
  pair.slice(0,2).forEach(c=>{c.el.classList.add('hint');setTimeout(()=>c.el.classList.remove('hint'),1600)});
};
function tap(c){
  if(lock||c.gone||!playing)return;
  if(c===sel){sel=null;c.el.classList.remove('sel');return}
  const st=c.parked?'free':cardState(c);
  if(st!=='free'){
    c.el.classList.add('bad');setTimeout(()=>c.el.classList.remove('bad'),350);
    tone(180,.15,'triangle',.05);
    toast(st==='covered'?'Tahle karta je zakrytá. Odeber nejdřív karty nad ní.':'Tahle karta je sevřená. Uvolni ji z jedné strany, nebo odlož souseda do okýnka dole.');
    return;
  }
  if(!sel){sel=c;c.el.classList.add('sel');tone(noteHz(SYM.indexOf(c.sym)),.15,'triangle',.08);return}
  const a=sel;sel=null;a.el.classList.remove('sel');
  if(a.sym===c.sym){
    const gain=100*Math.min(streak+1,5);
    streak++;bestStreak=Math.max(bestStreak,streak);okPairs++;score+=gain;
    a.gone=c.gone=true;a.el.classList.add('gone');c.el.classList.add('gone');
    for(const x of [a,c])if(x.parked){slots[slots.indexOf(x)]=null;setTimeout(()=>x.el.remove(),400)}
    const n=SYM.indexOf(c.sym);tone(noteHz(n),.6);tone(noteHz(n)*2,.4,'sine',.07);
    pop(c,'+'+gain);hud();
    if(cards.every(x=>x.gone))setTimeout(end,700);
  }else{
    streak=0;mistakes++;
    if(score>0){score=Math.max(0,score-20);pop(c,'-20',true)}
    tone(110,.25,'sawtooth',.06);
    const fs=slots.indexOf(null);
    if(!c.parked&&fs>=0){parkCard(c,fs);toast('Omyl. Kámen skočil do okýnka.')}
    else{
      lock=true;[a,c].forEach(x=>x.el.classList.add('bad'));
      setTimeout(()=>{[a,c].forEach(x=>x.el.classList.remove('bad'));lock=false},350);
    }
    hud();
  }
}
// ---------- uložení (jen v telefonu) ----------
const ls={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const nick=()=>ls.get('zp_name','Hráč');
function upsert(key,e){
  let L=ls.get(key,[]);const i=L.findIndex(x=>x.id===e.id);
  if(i>=0){if(L[i].s<e.s)L[i]=e}else L.push(e);
  L.sort((a,b)=>b.s-a.s);ls.set(key,L.slice(0,50));return L;
}
// Samostatná stránka s žebříčkem. Jména se vkládají přes textContent.
function boardPage(title,list,myId,buttons){
  const top=list.slice(0,10),rank=list.findIndex(x=>x.id===myId)+1;
  $('overlay').innerHTML=`<h1>${title}</h1>${rank?`<p>Jsi na ${rank}. místě</p>`:''}<ol id="lb"></ol>
   <p class="note">Žebříček je jen v tomto telefonu.</p><div id="lbBtns" style="display:flex;flex-direction:column;gap:10px;align-items:center"></div>`;
  const ol=$('lb');
  top.forEach((x,i)=>{
    const li=document.createElement('li');if(x.id===myId)li.className='me';
    const p=document.createElement('span');p.className='pos';p.textContent=(i+1)+'.';
    const n=document.createElement('span');n.className='nm';n.textContent=x.n;
    const lv=document.createElement('span');lv.className='lv';lv.textContent=x.l?'level '+x.l:'';
    const s=document.createElement('b');s.textContent=x.s;
    li.append(p,n,lv,s);ol.appendChild(li);
  });
  if(rank>10){const li=document.createElement('li');li.className='me';li.textContent=rank+'. '+nick()+': '+list[rank-1].s;ol.appendChild(li)}
  buttons.forEach(([label,alt,fn])=>{const b=document.createElement('button');b.textContent=label;if(alt)b.className='alt';b.onclick=fn;$('lbBtns').appendChild(b)});
  $('overlay').classList.add('show');
}
function end(){
  playing=false;
  const bonus=mistakes===0?500:0;score+=bonus;
  const acc=Math.round(100*okPairs/(okPairs+mistakes));
  [0,2,4,7,9].forEach((s,i)=>setTimeout(()=>tone(261.63*Math.pow(2,s/12),.5),i*120));
  const stats=`<p>Přesnost: ${acc} %</p><p>Nejdelší série: ${bestStreak}</p>${bonus?'<p>Bonus za kolo bez chyby: +500</p>':''}`;
  if(mode==='daily'){
    const d=dayNum(),key='zp_daily_'+d,prev=ls.get(key,0),best=Math.max(prev,score);ls.set(key,best);
    let st=ls.get('zp_streak',{d:0,n:0});
    if(st.d!==d){const y=new Date();y.setDate(y.getDate()-1);const yd=y.getFullYear()*10000+(y.getMonth()+1)*100+y.getDate();st={d,n:st.d===yd?st.n+1:1};ls.set('zp_streak',st)}
    const txt=`Zvukové páry, denní výzva ${d%100}.${Math.floor(d/100)%100}.: ${score} bodů, přesnost ${acc} %`;
    const id='d'+nick(),list=upsert('zp_board_daily_'+d,{id,n:nick(),s:score,l:0});
    $('overlay').innerHTML=`<h1>Denní výzva hotová</h1><div class="big">${score}</div>${stats}<p>Dnešní nejlepší: ${best}</p><p>Dny v řadě: ${st.n}</p>
     <button id="again">Zkusit znovu</button><button id="lbb" class="alt">Žebříček</button><button id="cp" class="alt">Zkopírovat výsledek</button><button id="tomenu" class="alt">Menu</button>`;
    $('again').onclick=startDaily;$('tomenu').onclick=()=>showMenu(false);
    $('cp').onclick=()=>{try{navigator.clipboard.writeText(txt).then(()=>toast('Zkopírováno'),()=>toast(txt))}catch(e){toast(txt)}};
    $('lbb').onclick=()=>boardPage('Žebříček dne',list,id,[['Zkusit znovu',false,startDaily],['Menu',true,()=>showMenu(false)]]);
  }else{
    const best=Math.max(ls.get('zp_best',0),score);ls.set('zp_best',best);ls.set('zp_maxlevel',Math.max(ls.get('zp_maxlevel',1),level+1));
    const list=upsert('zp_board',{id:runId,n:nick(),s:score,l:level});
    const next=positions(level%LEVELS.length).name;
    $('overlay').innerHTML=`<h1>Level ${level}: ${dims.name}</h1><div class="big">${score}</div>${stats}<p>Rekord: ${best}</p>
     <button id="nextb">Level ${level+1}: ${next}</button><button id="lbb" class="alt">Žebříček</button><button id="tomenu" class="alt">Menu</button>`;
    $('nextb').onclick=()=>{level++;startLevel()};$('tomenu').onclick=()=>showMenu(false);
    $('lbb').onclick=()=>boardPage('Žebříček',list,runId,[['Level '+(level+1)+': '+next,false,()=>{level++;startLevel()}],['Menu',true,()=>showMenu(false)]]);
  }
  $('overlay').classList.add('show');
}
function showMenu(canResume){
  const d=dayNum(),dBest=ls.get('zp_daily_'+d,0),st=ls.get('zp_streak',{d:0,n:0});
  const maxLv=Math.max(1,ls.get('zp_maxlevel',1));let startLv=Math.min(level>1&&!canResume?level:1,maxLv);
  const dayName=positions(2+d%(LEVELS.length-2)).name;
  $('overlay').innerHTML=`<div class="logo"><div class="mini">${ICONS.lebka}</div><div class="mini">${ICONS.kytara}</div><div class="mini">${ICONS.anarchy}</div></div>
   <h1>Zvukové páry</h1><p class="sub">punkový mahjong s hudbou</p>
   <div class="stats"><div><small>Rekord</small><b>${ls.get('zp_best',0)}</b></div><div><small>Level</small><b>${maxLv}</b></div><div><small>Dny v řadě</small><b>${st.n||0}</b></div></div>
   <div class="field"><label for="nick">Přezdívka</label><input id="nick" maxlength="12" placeholder="Přezdívka" autocomplete="off"></div>
   ${canResume?'<button id="resume">Pokračovat</button>':''}
   <button id="play">${canResume?'Nová hra':'Hrát'}<small id="playsub"></small></button>
   ${maxLv>1?'<div class="stepper"><button class="alt" id="lvm" aria-label="Nižší level">‹</button><b id="lvt"></b><button class="alt" id="lvp" aria-label="Vyšší level">›</button></div>':''}
   <button id="daily" class="alt">Denní výzva<small>Dnes: ${dayName}${dBest?' · nejlepší '+dBest:''}</small></button>
   <button class="link" id="how">Jak se hraje</button>
   <div class="howto" id="howbox" hidden><p>Spáruj dva stejné kameny. Vybrat jde jen kámen, na kterém nic neleží a který je aspoň z jedné strany volný.</p><p>Kámen mezi dvěma sousedy musíš nejdřív uvolnit. Volné kameny můžeš odložit do okýnek dole, než se uvolní jejich dvojče. Okýnek s levely ubývá. Omylem vybraný kámen skočí do okýnka sám.</p><p>Série správných párů zvyšuje body až pětkrát. Chyba stojí 20 bodů, rada 50.</p></div>
   <p class="note">Nepiš celé jméno, stačí přezdívka. Žebříček je jen v tomto telefonu.</p>`;
  $('overlay').classList.add('show');
  const inp=$('nick');inp.value=ls.get('zp_name','');
  inp.oninput=()=>{inp.value=inp.value.replace(/[^\p{L}\p{N} ._-]/gu,'');ls.set('zp_name',inp.value.trim()||'Hráč')};
  if(!ls.get('zp_name',''))ls.set('zp_name','Hráč');
  const lvName=n=>positions((n-1)%LEVELS.length).name;
  const upd=()=>{if($('lvt'))$('lvt').textContent='Začít od levelu '+startLv+': '+lvName(startLv);$('playsub').textContent=startLv>1?'Level '+startLv+': '+lvName(startLv):''};
  if($('lvm')){$('lvm').onclick=()=>{startLv=Math.max(1,startLv-1);upd()};$('lvp').onclick=()=>{startLv=Math.min(maxLv,startLv+1);upd()}}
  upd();
  $('how').onclick=()=>{$('howbox').hidden=!$('howbox').hidden};
  if(canResume)$('resume').onclick=()=>$('overlay').classList.remove('show');
  $('play').onclick=()=>{mode='play';level=startLv;score=0;runId='r'+Date.now();startLevel()};
  $('daily').onclick=startDaily;
}
$('menu').onclick=()=>showMenu(playing);
addEventListener('resize',()=>cards&&layout());
score=0;
// pozadí hry za menu: ukázkové rozložení
newRound(0,1,null,3);playing=false;showMenu(false);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
