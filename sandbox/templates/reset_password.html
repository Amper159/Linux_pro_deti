<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nové heslo – Pískoviště TUX-1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap&subset=latin-ext" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #0d1b2a;
            background-image:
                radial-gradient(#1b263b 2px, transparent 2px),
                radial-gradient(#1b263b 2px, #0d1b2a 2px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }
        .lego-card-yellow { border: 3px solid #facc15; box-shadow: 0 5px 0 #ca8a04; }
    </style>
</head>
<body class="w-screen min-h-screen flex items-center justify-center p-4 text-slate-100">

<div class="bg-slate-800 rounded-2xl p-6 w-full max-w-md lego-card-yellow text-center space-y-4">
    <div class="w-16 h-16 bg-gradient-to-b from-sky-400 to-indigo-600 rounded-full mx-auto flex items-center justify-center border-4 border-slate-700">
        <i class="fa-solid fa-key text-2xl text-sky-100"></i>
    </div>
    <div>
        <h2 class="text-2xl font-bold text-amber-300 uppercase">Nové heslo</h2>
        <p class="text-xs text-slate-300 font-medium mt-1">
            Zadej nové heslo ke svému účtu v Pískovišti.
        </p>
    </div>

    <div id="reset-form" class="space-y-4">
        <input type="password" id="reset-pass" autocomplete="new-password"
               class="w-full bg-slate-900 border-2 border-sky-400 rounded-xl p-3 text-center font-bold placeholder-slate-500 focus:outline-none focus:border-emerald-400"
               placeholder="Nové heslo (aspoň 6 znaků)">
        <input type="password" id="reset-pass2" autocomplete="new-password"
               class="w-full bg-slate-900 border-2 border-sky-400 rounded-xl p-3 text-center font-bold placeholder-slate-500 focus:outline-none focus:border-emerald-400"
               placeholder="Heslo ještě jednou">
        <p id="reset-error" class="text-rose-400 text-xs font-bold min-h-[16px]"></p>
        <button id="reset-button"
                class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl border-b-4 border-emerald-700 active:translate-y-1 transition uppercase tracking-wider">
            Nastavit nové heslo
        </button>
    </div>

    <div id="reset-done" class="hidden space-y-3">
        <p class="text-emerald-400 font-bold">✅ Heslo je nastavené. Teď se s ním přihlas.</p>
        <a href="/piskoviste/" class="block bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl border-b-4 border-emerald-700 active:translate-y-1 transition uppercase tracking-wider">
            Jít na přihlášení
        </a>
    </div>

    <a href="/piskoviste/" class="block text-xs text-sky-400 hover:text-sky-300 font-bold">← Zpět na přihlášení</a>
</div>

<script>
const TOKEN = {{ token | tojson }};
const $ = (id) => document.getElementById(id);

$("reset-button").addEventListener("click", async () => {
    const pass = $("reset-pass").value;
    const pass2 = $("reset-pass2").value;
    $("reset-error").textContent = "";

    if (!TOKEN) { $("reset-error").textContent = "Odkaz na obnovu hesla chybí nebo je neplatný."; return; }
    if (pass !== pass2) { $("reset-error").textContent = "Hesla se neshodují."; return; }

    const button = $("reset-button");
    button.disabled = true;
    try {
        const res = await fetch("/piskoviste/api/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: TOKEN, password: pass }),
        });
        const data = await res.json();
        if (!data.ok) { $("reset-error").textContent = data.error; return; }
        $("reset-form").classList.add("hidden");
        $("reset-done").classList.remove("hidden");
    } finally {
        button.disabled = false;
    }
});

["reset-pass", "reset-pass2"].forEach((id) =>
    $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") $("reset-button").click(); })
);
</script>
</body>
</html>
